[project]
name = "longjev"
version = "0.1.0"
description = "Long-input wrapper for TypeSafe's Jev decision model: Jev selects what matters, then Jev answers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "numpy>=1.26"]

[project.optional-dependencies]
eval = ["python-dotenv>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "python-dotenv>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/longjev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
